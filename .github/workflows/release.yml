name: Build and release

# Builds SQliteView for Windows, macOS and Linux.
# - Every push/PR to main: run the tests and build all three packages (downloadable as workflow artifacts).
# - Pushing a tag like v0.2.0: also publish a GitHub Release with the packages attached.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-latest }
          - { name: macOS arm64, os: macos-15 }
          - { name: macOS x64, os: macos-15-intel }
          - { name: Linux x86_64, os: ubuntu-22.04 }  # older glibc => runs on more distributions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libfontconfig1 libdbus-1-3 libfuse2

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q

      - name: Install Inno Setup (Windows installer)
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y

      - name: Install appimagetool (Linux AppImage)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          echo "APPIMAGETOOL=$PWD/appimagetool" >> "$GITHUB_ENV"

      - name: Build package
        run: python scripts/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: SQliteView-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.dmg
            dist/*.tar.gz
            dist/*.AppImage
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          generate_release_notes: true
