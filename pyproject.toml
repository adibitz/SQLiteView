[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sqliteview"
description = "SQliteView: browse, edit and query SQLite databases (PySide6 port of DB Browser for SQLite)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later OR MPL-2.0" }
dynamic = ["version"]
dependencies = ["PySide6>=6.6"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: X11 Applications :: Qt",
    "Topic :: Database :: Front-Ends",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
# MCP server for Claude and other AI assistants (always included in the packaged builds)
mcp = ["mcp>=1.26,<2"]
dev = ["sqliteview[mcp]", "pytest>=8", "pyinstaller>=6.6", "pillow>=10"]

[project.gui-scripts]
sqliteview = "sqliteview.app:main"

# A console program: MCP clients talk to it over stdin/stdout, which GUI programs don't have on Windows
[project.scripts]
sqliteview-mcp = "sqliteview.mcp.server:main"

[project.urls]
Homepage = "https://github.com/adibitz/SQLiteView"

[tool.setuptools.dynamic]
version = { attr = "sqliteview.__version__" }

[tool.setuptools.packages.find]
include = ["sqliteview*"]

[tool.setuptools.package-data]
sqliteview = ["assets/fonts/*", "assets/icons/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
